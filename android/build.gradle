apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace "com.reactvision.viroonnx"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    compileOnly 'com.facebook.react:react-android:+'

    // VRTObjectDetectorView (the inference-provider host) lives in @reactvision/react-viro,
    // included by the app as the ':react_viro' Gradle project (see the app settings.gradle
    // entry added by the react-viro config plugin). compileOnly: the app already bundles it
    // at runtime, so we only need its classes on the compile classpath.
    compileOnly project(':react_viro')
}
